# BUC Customer Service & Ticket Management System — production-style stack.
#   cp .env.example .env   # then edit secrets and domain
#   ./scripts/gen-selfsigned-cert.sh service.example.com   # or install a real certificate
#   docker compose up -d --build
#   docker compose exec api python -m app.cli create-admin --username admin --full-name "System Administrator"
name: buc-service

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buc_service}
      POSTGRES_USER: ${POSTGRES_USER:-buc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build: ./backend
    image: buc-service/api:${BUC_VERSION:-1.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      BUC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-buc_service}
      BUC_STORAGE_DIR: /data/storage
      BUC_RUN_MIGRATIONS: "1"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [backend, frontend]

  worker:
    image: buc-service/api:${BUC_VERSION:-1.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      BUC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-buc_service}
      BUC_STORAGE_DIR: /data/storage
      BUC_RUN_MIGRATIONS: "0"
    command: ["python", "-m", "app.worker"]
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    image: buc-service/web:${BUC_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

  # Optional: local SMTP catcher for testing e-mail (docker compose --profile mail up -d).
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]

volumes:
  pgdata:
  storage:
  certbot-webroot:

networks:
  backend:
    internal: false
  frontend:
